<!-- Lien d'évitement : hors de l'écran tant qu'il n'a pas le focus. Pas de href="#contenu" écrit en dur :
     avec <base href="/">, il renverrait vers l'accueil. Le routeur garde l'adresse de la page. -->
<a
  class="skip-link"
  [routerLink]="[]"
  fragment="contenu"
  queryParamsHandling="preserve"
  (click)="goToContent()"
  >Aller au contenu</a
>

<div class="shell" [class.fits-window]="fitsWindow()">
  <nav class="nav" aria-label="Navigation principale">
    <a eMarque class="brand" routerLink="/">Apex</a>

    <!-- Le libellé est dans une balise d'Apex : sous 760px, shell.css ne le montre plus (il reste lu). -->
    <ul class="links">
      <li>
        <a eLienNav class="link" icone="objectifs" routerLink="/" [attr.aria-current]="objectivesCurrent()"
          ><span class="link-label">Objectifs</span></a
        >
      </li>
      <li>
        <a eLienNav class="link" icone="matrice" routerLink="/matrice" routerLinkActive ariaCurrentWhenActive="page"
          ><span class="link-label">Matrice</span></a
        >
      </li>
    </ul>

    <div class="nav-bottom">
      <div class="ds-row ds-rule-top person">
        @if (initial()) {
          <span class="initial voix" aria-hidden="true">{{ initial() }}</span>
        }
        <!-- Une grille à une piste minmax(0, 1fr) ne réclame aucune largeur : sans elle, une adresse longue
             élargirait toute la navigation (232px dans les maquettes) au lieu d'être coupée. -->
        <div class="ds-grid ds-grow">
          <span class="detail ds-truncate">{{ identity() }}</span>
        </div>
        <e-menu libelle="Réglages" icone="reglages" [entrees]="settings()" (choix)="chooseTheme($event)" />
      </div>
    </div>

    <!-- Sous 760px, le bas de la navigation disparaît : les réglages restent accessibles ici. -->
    <div class="ds-show-mobile ds-push-right">
      <e-menu libelle="Réglages" icone="reglages" [entrees]="settings()" (choix)="chooseTheme($event)" />
    </div>
  </nav>

  <main class="page" id="contenu" tabindex="-1" #contenu>
    <div class="content">
      @if (annonces.signalement(); as texte) {
        <aside eNote>
          <p>{{ texte }}</p>
          <div eNoteActions>
            <button eBouton="trait" petit type="button" (click)="understood()">Compris</button>
          </div>
        </aside>
      }

      <!-- Un bloc simple autour de la sortie : sinon router-outlet, élément vide de la colonne, ajouterait
           l'écart de la coque au-dessus de chaque page. Pour une page qui tient dans la fenêtre, il lui passe la
           hauteur qui reste. -->
      <div class="outlet">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
