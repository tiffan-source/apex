<nav class="ds-float-bottom ds-icons-only-mobile" aria-label="Navigation principale">
  <p-toolbar>
    <div class="ds-row ds-gap-1">
      @for (item of navigationList; track item.link) {
        <a
          pButton
          [routerLink]="item.link"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.link === '/' }"
          [text]="!rla.isActive"
          [severity]="rla.isActive ? 'primary' : 'secondary'"
          [icon]="item.primeIcon"
         
          [label]="item.label"
          size="small"
          [attr.aria-label]="item.label"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        ></a>
      }

      @if (drawerStore.canBeActivated()) {
        <p-divider layout="vertical" />
        <p-button text severity="secondary" icon="pi pi-comments" label="Assistant" ariaLabel="Assistant" size="small" (click)="drawerStore.openChatDrawer()" />
        <p-button text severity="secondary" icon="pi pi-pencil" label="Modifier" ariaLabel="Modifier l'objectif" size="small" (click)="drawerStore.openObjectiveEditionDrawer()" />
      }
    </div>
  </p-toolbar>
</nav>

<div class="ds-page">
  <router-outlet></router-outlet>
</div>
