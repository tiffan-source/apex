<div class="app">
  <div class="shell">
    <nav class="navigation">
      <ul class="navigation-list">
        @for (item of navigationList; track $index) {
          <li class="navigation-list__item {{router.url === item.link ? 'navigation-list__item__active' : ''}}" (click)="navigateTo(item.link)"> <span style="font-size: 1.2rem" class="{{item.primeIcon}}"></span></li>
        }

        @if(chatDrawerStore.canBeActivated()){
          <li (click)="chatDrawerStore.openDrawer()"><span style="font-size: 1.2rem" class="pi pi-comments"></span></li>
        }
      </ul>
    </nav>
  </div>
  <div class="app__content">
    <router-outlet></router-outlet>
  </div>
</div>
