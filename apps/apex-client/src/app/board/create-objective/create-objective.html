<p-dialog [visible]="open()" [modal]="true" [style]="{ width: 'var(--ds-dialog-width)' }" [breakpoints]="{ '640px': 'var(--ds-dialog-width-mobile)' }" (onHide)="setOpen.emit(false)" (keydown.escape)="setOpen.emit(false)">
  <ng-template #header>
    <div class="modal-objective-header">
      <span class="pi pi-sparkles modal-objective-header__icon" aria-hidden="true"></span>
      <h1>Définissons votre objectif</h1>
    </div>
</ng-template>
  <form [formGroup]="createObjectiveForm" (submit)="createObjective()">
    <div class="modal-objective-form-field">
        <label for="{{ CreateObjectiveFormField.TITLE }}">Un titre simple qui le représente <span class="required" aria-hidden="true">*</span></label>
        <input placeholder="Monter mon entreprise" formControlName="{{ CreateObjectiveFormField.TITLE }}" pInputText id="{{ CreateObjectiveFormField.TITLE }}" />
    </div>
    <div class="modal-objective-form-field">
        <label for="{{ CreateObjectiveFormField.DESCRIPTION }}">Décrivons le un peu plus en détail</label>
        <textarea placeholder="Décrivez votre objectif en quelques mots..." formControlName="{{ CreateObjectiveFormField.DESCRIPTION }}" pTextarea id="{{ CreateObjectiveFormField.DESCRIPTION }}"></textarea>
    </div>
    <div class="modal-objective-form-field">
        <label for="{{ CreateObjectiveFormField.WHY }}">Pourquoi cet objectif est important pour vous ?</label>
        <textarea placeholder="Expliquez pourquoi cet objectif vous tient à cœur..." formControlName="{{ CreateObjectiveFormField.WHY }}" rows="5" pTextarea id="{{ CreateObjectiveFormField.WHY }}"></textarea>
    </div>
    <div class="modal-objective-form-field">
        <label for="{{ CreateObjectiveFormField.DUE_DATE }}">Une date cible ?</label>
        <input type="date" formControlName="{{ CreateObjectiveFormField.DUE_DATE }}" pInputText id="{{ CreateObjectiveFormField.DUE_DATE }}" />
    </div>
    <div class="modal-objective-action">
        <p-button label="Annuler" severity="secondary" variant="text" (click)="setOpen.emit(false)" />
        <p-button [loading]="isLoading()" label="Créer l'objectif" type="submit" [disabled]="!isFormValid()" />
    </div>
  </form>
</p-dialog>
