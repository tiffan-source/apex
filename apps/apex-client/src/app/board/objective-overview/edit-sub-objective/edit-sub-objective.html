<p-dialog header="Modifier le sous-objectif" [visible]="open()" [modal]="true" [style]="{ width: 'var(--ds-dialog-width)' }" [breakpoints]="{ '640px': 'var(--ds-dialog-width-mobile)' }" (onHide)="abort.emit()" (keydown.escape)="abort.emit()">
  @if(form){
    <form [formGroup]="form" class="ds-stack">
      <div class="ds-stack ds-gap-2">
        <label for="{{ EditSubObjectiveFormField.TITLE }}">Titre</label>
        <input placeholder="Déclarer mon entreprise" formControlName="{{ EditSubObjectiveFormField.TITLE }}" pInputText fluid id="{{ EditSubObjectiveFormField.TITLE }}" />
      </div>
      <div class="ds-stack ds-gap-2">
        <label for="{{ EditSubObjectiveFormField.DESCRIPTION }}">Description (facultatif)</label>
        <textarea placeholder="Décrivez ce sous-objectif en quelques mots…" formControlName="{{ EditSubObjectiveFormField.DESCRIPTION }}" pTextarea fluid id="{{ EditSubObjectiveFormField.DESCRIPTION }}"></textarea>
      </div>
      <div class="ds-stack ds-gap-2">
        <label for="{{ EditSubObjectiveFormField.DUE_DATE }}">Date cible (facultatif)</label>
        <p-datepicker inputId="{{ EditSubObjectiveFormField.DUE_DATE }}" formControlName="{{ EditSubObjectiveFormField.DUE_DATE }}" [showIcon]="true" placeholder="jj/mm/aaaa" fluid appendTo="body" />
      </div>
    </form>
  }
  <ng-template #footer>
    <p-button severity="secondary" variant="text" label="Annuler" (click)="abort.emit()" />
    <p-button label="Enregistrer" (click)="editObjective()" [disabled]="!form || form.invalid" />
  </ng-template>
</p-dialog>
