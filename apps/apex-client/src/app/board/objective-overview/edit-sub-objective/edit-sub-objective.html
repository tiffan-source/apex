<p-dialog [visible]="open()" [modal]="true" [style]="{ width: 'var(--ds-dialog-width)' }" [breakpoints]="{ '640px': 'var(--ds-dialog-width-mobile)' }" (onHide)="abort.emit()" (keydown.escape)="abort.emit()">
  <ng-template #header>
    <div class="modal-sub-objective-header">
      <h1>Modifier le sous-objectif</h1>
    </div>
  </ng-template>
  @if(form){
    <form [formGroup]="form" class="edit-sub-objective">
      <div class="edit-sub-objective-field">
        <label for="{{ EditSubObjectiveFormField.TITLE }}">Titre</label>
        <input placeholder="Déclarer mon entreprise" formControlName="{{ EditSubObjectiveFormField.TITLE }}" pInputText id="{{ EditSubObjectiveFormField.TITLE }}" />
      </div>
      <div class="edit-sub-objective-field">
        <label for="{{ EditSubObjectiveFormField.DESCRIPTION }}">Description (facultatif)</label>
        <textarea placeholder="Décrivez votre objectif en quelques mots..." formControlName="{{ EditSubObjectiveFormField.DESCRIPTION }}" pTextarea id="{{ EditSubObjectiveFormField.DESCRIPTION }}"></textarea>
      </div>
      <div class="edit-sub-objective-field">
        <label for="{{ EditSubObjectiveFormField.DUE_DATE }}">Date cible (facultatif)</label>
        <input type="date" formControlName="{{ EditSubObjectiveFormField.DUE_DATE }}" pInputText id="{{ EditSubObjectiveFormField.DUE_DATE }}" />
      </div>
    </form>
  }
  <ng-template #footer>
    <div class="edit-sub-objective__footer">
      <p-button severity="secondary" variant="text" label="Annuler" (click)="abort.emit()" />
      <p-button label="Enregistrer" (click)="editObjective()" [disabled]="!form || form.invalid" />
    </div>
  </ng-template>
</p-dialog>
