<p-drawer
  [visible]="drawerStore.chat.isOpen()"
  header="{{ objectifTitle() }}"
  [style]="{ width: 'min(var(--ds-drawer-width-wide), 100vw)' }"
  (onHide)="drawerStore.closeChatDrawer()"
  position="right"
>
    <ng-template #content>
      <div #chatContainer class="ds-stack ds-gap-8">
        @for (item of chatStore.orderLatestMessages(); track item.id) {
          @if(item.sender === "user") {
            <div class="ds-row ds-end">
              <p-card class="ds-chat-bubble" [dt]="userBubbleTokens">
                <div [innerHTML]="item.content | markdown"></div>
              </p-card>
            </div>
          } @else {
            <div class="ds-stack" [innerHTML]="item.content | markdown"></div>
          }
        }
        @if(chatStore.isAwaitingPermission()){
          <p-message severity="info" icon="pi pi-shield">
            <div class="ds-stack ds-gap-3">
              <span>{{ permissionPrompt() }}</span>
              <div class="ds-row ds-end ds-gap-2">
                <p-button label="Refuser" severity="secondary" size="small" (click)="chatStore.respondToPermission(false)" />
                <p-button label="Autoriser" size="small" (click)="chatStore.respondToPermission(true)" />
              </div>
            </div>
          </p-message>
        } @else if(chatStore.isStreaming()){
          <div class="ds-row ds-gap-2 ds-text-sm ds-text-muted ds-text-italic" role="status">
            <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
            <span>{{ chatStore.processingStatus() }}</span>
          </div>
        }
      </div>
    </ng-template>

    <ng-template #footer>
      <div class="ds-row">
        <input pInputText fluid type="text" class="ds-grow" placeholder="Posez une question sur cet objectif…" [(ngModel)]="promptMessage" (keydown.enter)="sendMessage()" [disabled]="!chatStore.canSendMessage()"/>
        <p-button label="Envoyer" icon="pi pi-send" (click)="sendMessage()" [disabled]="!chatStore.canSendMessage()" />
      </div>
    </ng-template>
</p-drawer>
