<p-drawer
  [visible]="chatDrawerStore.isOpen()"
  header="{{ objectifTitle() }}"
  [style]="{width: '70vw'}"
  (onHide)="chatDrawerStore.closeDrawer()"
  position="right"
>
    <ng-template #content >
      <div #chatContainer class="chat-content">
        @for (item of chatStore.orderLatestMessages(); track item.id) {
          @if(item.sender === "user") {
            <p-card class="chat-message-user">
              <div class="chat-message-user-content" [innerHTML]="item.content | markdown"></div>
            </p-card>
          } @else {
            <div class="chat-message-assistant">
              <div class="chat-message-assistant-content" [innerHTML]="item.content | markdown"></div>
            </div>
          }
        }
        @if(chatStore.isStreaming()){
          <div class="chat-message-assistant">
            <p-skeleton class="mb-2" />
            <p-skeleton width="10rem" class="mb-2" />
            <p-skeleton width="5rem" class="mb-2" />
          </div>
        }
      </div>
    </ng-template>

    <ng-template #footer>
        <div class="chat-input">
            <input pInputText fluid type="text" placeholder="Type a message" [(ngModel)]="promptMessage" (keydown.enter)="sendMessage()"/>
            <button pButton type="button" label="Send" (click)="sendMessage()" [disabled]="chatStore.isStreaming()"></button>
        </div>
    </ng-template>
</p-drawer>
