<p-drawer
  [visible]="drawerStore.chat.isOpen()"
  header="{{ objectifTitle() }}"
  [style]="{width: 'min(48rem, 100vw)'}"
  (onHide)="drawerStore.closeChatDrawer()"
  position="right"
>
    <ng-template #content >
      <div #chatContainer class="chat-content">
        @for (item of chatStore.orderLatestMessages(); track item.id) {
          @if(item.sender === "user") {
            <p-card class="chat-message-user">
              <div class="chat-message-user-content" [innerHTML]="item.content | markdown"></div>
            </p-card>
          } @else {
            <div class="chat-message-assistant">
              <div class="chat-message-assistant-content" [innerHTML]="item.content | markdown"></div>
            </div>
          }
        }
        @if(chatStore.isAwaitingPermission()){
          <div class="chat-message-assistant">
            <div class="chat-permission">
              <p class="chat-permission-label">{{ permissionPrompt() }}</p>
              <div class="chat-permission-actions">
                <p-button label="Refuser" severity="secondary" (click)="chatStore.respondToPermission(false)" />
                <p-button label="Autoriser" (click)="chatStore.respondToPermission(true)" />
              </div>
            </div>
          </div>
        } @else if(chatStore.isStreaming()){
          <div class="chat-message-assistant">
            <div class="chat-status">
              <span class="chat-status-dots" aria-hidden="true"><span></span><span></span><span></span></span>
              <span class="chat-status-label">{{ chatStore.processingStatus() }}</span>
            </div>
          </div>
        }
      </div>
    </ng-template>

    <ng-template #footer>
        <div class="chat-input">
            <input pInputText fluid type="text" placeholder="Posez une question sur cet objectif…" [(ngModel)]="promptMessage" (keydown.enter)="sendMessage()" [disabled]="!chatStore.canSendMessage()"/>
            <button pButton type="button" label="Envoyer" (click)="sendMessage()" [disabled]="!chatStore.canSendMessage()"></button>
        </div>
    </ng-template>
</p-drawer>
