<p-drawer
  [visible]="drawerStore.objectiveEdition.isOpen()"
  header="Modifier l'objectif"
  [style]="{ width: 'min(var(--ds-drawer-width), 100vw)' }"
  (onHide)="drawerStore.closeObjectiveEditionDrawer()"
  position="right"
>
  <ng-template #content>
    <form [formGroup]="form" class="ds-stack">
      <div class="ds-stack ds-gap-2">
        <label for="{{ EditObjectiveFormField.TITLE }}">Un titre simple qui le représente</label>
        <input placeholder="Monter mon entreprise" formControlName="{{ EditObjectiveFormField.TITLE }}" pInputText fluid id="{{ EditObjectiveFormField.TITLE }}" />
      </div>
      <div class="ds-stack ds-gap-2">
        <label for="{{ EditObjectiveFormField.DESCRIPTION }}">Décrivez-le en quelques mots</label>
        <textarea placeholder="Décrivez votre objectif en quelques mots…" formControlName="{{ EditObjectiveFormField.DESCRIPTION }}" pTextarea fluid id="{{ EditObjectiveFormField.DESCRIPTION }}"></textarea>
      </div>
      <div class="ds-stack ds-gap-2">
        <label for="{{ EditObjectiveFormField.WHY }}">Pourquoi cet objectif est important pour vous ?</label>
        <textarea placeholder="Expliquez pourquoi cet objectif vous tient à cœur…" formControlName="{{ EditObjectiveFormField.WHY }}" rows="4" pTextarea fluid id="{{ EditObjectiveFormField.WHY }}"></textarea>
      </div>
      <div class="ds-stack ds-gap-2">
        <label for="{{ EditObjectiveFormField.DUE_DATE }}">Date cible</label>
        <p-datepicker inputId="{{ EditObjectiveFormField.DUE_DATE }}" formControlName="{{ EditObjectiveFormField.DUE_DATE }}" [showIcon]="true" placeholder="jj/mm/aaaa" fluid appendTo="body" />
      </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <div class="ds-row ds-end ds-gap-2">
      <p-button severity="secondary" variant="text" label="Annuler" (click)="drawerStore.closeObjectiveEditionDrawer()" />
      <p-button label="Enregistrer" (click)="editObjective()" />
    </div>
  </ng-template>
</p-drawer>
