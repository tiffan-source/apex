<p-dialog [visible]="open()" [modal]="true" [style]="{ width: '40rem' }" [breakpoints]="{ '640px': '92vw' }" (onHide)="abort.emit()" (keydown.escape)="abort.emit()">
  <ng-template #header>
    <div class="modal-task-header">
      <h1>Modifier la tâche</h1>
    </div>
  </ng-template>
  @if(form){
    <form [formGroup]="form" (submit)="editTask()" class="edit-task">
      <div>
        <label for="edit-task-title">Titre</label>
        <input pInputText id="edit-task-title" placeholder="Titre de la tâche" [formControlName]="EditTaskFormField.TITLE" fluid/>
      </div>
      <div class="edit-task__select">
        <div>
          <label>Objectif lié</label>
          <p-select fluid [options]="optionsObjective()" [formControlName]="EditTaskFormField.OBJECTIVE" ariaLabel="Objectif lié"/>
        </div>
        <div class="edit-task__select__importance-urgency">
          <p-select fluid [options]="optionsImportance" [formControlName]="EditTaskFormField.IMPORTANT" ariaLabel="Importance"/>
          <p-select fluid [options]="optionUrgerncy" [formControlName]="EditTaskFormField.URGENT" ariaLabel="Urgence"/>
        </div>
      </div>
    </form>
  }

  <ng-template #footer>
    <div class="edit-task__footer">
      <p-button severity="secondary" variant="text" label="Annuler" (click)="abort.emit()" />
      <p-button label="Enregistrer" (click)="editTask()" [disabled]="!form || form.invalid" />
    </div>
  </ng-template>
</p-dialog>
