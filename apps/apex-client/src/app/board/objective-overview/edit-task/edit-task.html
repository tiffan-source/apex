<p-dialog header="Modifier la tâche" [visible]="open()" [modal]="true" [style]="{ width: 'var(--ds-dialog-width)' }" [breakpoints]="{ '640px': 'var(--ds-dialog-width-mobile)' }" (onHide)="abort.emit()" (keydown.escape)="abort.emit()">
  @if(form){
    <form [formGroup]="form" (submit)="editTask()" class="ds-stack">
      <div class="ds-stack ds-gap-2">
        <label for="edit-task-title">Titre</label>
        <input pInputText id="edit-task-title" placeholder="Titre de la tâche" [formControlName]="EditTaskFormField.TITLE" fluid/>
      </div>
      <div class="ds-stack ds-gap-2">
        <label for="edit-task-objective">Objectif lié</label>
        <p-select inputId="edit-task-objective" fluid [options]="optionsObjective()" [formControlName]="EditTaskFormField.OBJECTIVE" appendTo="body"/>
      </div>
      <div class="ds-grid ds-grid-fit ds-grid-field">
        <div class="ds-stack ds-gap-2">
          <label for="edit-task-importance">Importance</label>
          <p-select inputId="edit-task-importance" fluid [options]="optionsImportance" [formControlName]="EditTaskFormField.IMPORTANT" appendTo="body"/>
        </div>
        <div class="ds-stack ds-gap-2">
          <label for="edit-task-urgency">Urgence</label>
          <p-select inputId="edit-task-urgency" fluid [options]="optionUrgerncy" [formControlName]="EditTaskFormField.URGENT" appendTo="body"/>
        </div>
      </div>
    </form>
  }

  <ng-template #footer>
    <p-button severity="secondary" variant="text" label="Annuler" (click)="abort.emit()" />
    <p-button label="Enregistrer" (click)="editTask()" [disabled]="!form || form.invalid" />
  </ng-template>
</p-dialog>
