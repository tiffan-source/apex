<p-card class="stats-card">
  <div class="stats-card__header" [style.--stat-color]="color()">
    <div class="stats-card__header__icon">
      <span class="{{ primeIcon() }}" aria-hidden="true"></span>
    </div>
    <div class="stats-card__header__content">
      <span class="stats-card__header__content__value">{{ numberStat() }}</span>
      <span class="stats-card__header__content__label">{{ statLabel() }}</span>
    </div>
  </div>
</p-card>
