<p-card class="ds-fill">
  <ng-template #title>
    <div class="ds-row ds-between">
      <p-tag [value]="label()" [severity]="severity()" />
      <p-badge [value]="tasks().length" [severity]="severity()" />
    </div>
  </ng-template>
  <ng-template #subtitle>{{ description() }}</ng-template>

  <ul class="ds-stack ds-gap-0-5">
    @for (item of tasks(); track item.id) {
      <li class="ds-row ds-list-row">
        <p-checkbox (click)="toggleTaskDone(item.id, item.done)" [ngModel]="item.done" [readonly]="true" [binary]="true" [ariaLabel]="'Marquer « ' + item.title + ' » comme terminée'"/>
        <div class="ds-stack ds-gap-0-5 ds-grow">
          <span class="ds-text-strong ds-break" [class.ds-strike]="item.done">{{ item.title }}</span>
          <span class="ds-text-xs ds-text-muted">{{ item.objectiveTitle }}</span>
        </div>
      </li>
    } @empty {
      <li><p class="ds-text-italic">{{ emptyMessage() }}</p></li>
    }
  </ul>
</p-card>
