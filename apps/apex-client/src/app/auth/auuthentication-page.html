<main class="ds-screen-center">
  <form eSurface class="ds-panel ds-narrow ds-gap-8" [formRoot]="credentials" aria-labelledby="auth-title">
    <header class="ds-stack ds-gap-6">
      <e-marque>Apex</e-marque>
      <div class="ds-stack ds-gap-2">
        <h1 class="objectif ds-break" id="auth-title">{{ texts().title }}</h1>
        <p class="voix ds-muted">{{ tagline }}</p>
      </div>
    </header>

    <div class="ds-stack">
      <e-champ libelle="Ton adresse e-mail" [erreur]="emailServerError()">
        <input eSaisie id="auth-email" type="email" autocomplete="username" [formField]="credentials.email" />
      </e-champ>

      <e-champ
        libelle="Ton mot de passe"
        [aide]="creatingAccount() ? passwordHelp : undefined"
        [erreur]="passwordServerError()"
      >
        <input
          eSaisie
          id="auth-password"
          type="password"
          [attr.autocomplete]="creatingAccount() ? 'new-password' : 'current-password'"
          [formField]="credentials.password"
        />
      </e-champ>

      @if (creatingAccount()) {
        <e-champ libelle="Confirme ton mot de passe">
          <input
            eSaisie
            id="auth-confirm-password"
            type="password"
            autocomplete="new-password"
            [formField]="credentials.confirmPassword"
          />
        </e-champ>
      }
    </div>

    @if (note(); as text) {
      <aside eNote>
        <p role="alert">{{ text }}</p>
      </aside>
    }

    <div class="ds-stack ds-gap-3">
      <div class="ds-row ds-wrap">
        <button eBouton="sceau" type="submit" [attr.aria-disabled]="pending() ? 'true' : null">
          {{ texts().submit }}
        </button>
        <p class="detail ds-muted" role="status">{{ status() }}</p>
      </div>
      <button
        eBouton="nu"
        type="button"
        class="ds-self-start"
        [attr.aria-disabled]="pending() ? 'true' : null"
        (click)="switchMode()"
      >
        {{ texts().switch }}
      </button>
    </div>
  </form>
</main>
