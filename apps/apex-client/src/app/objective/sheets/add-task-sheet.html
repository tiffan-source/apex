<e-feuille titre="Ajouter un pas">
  <form class="ds-stack" id="feuille-ajout-pas" [formRoot]="fields">
    <e-champ libelle="Le pas" aide="Une action concrète, que tu peux faire en une fois.">
      <input eSaisie autocomplete="off" [formField]="fields.title" />
    </e-champ>
    <e-champ libelle="Étape" [erreur]="stageError()">
      <e-selection [options]="stageOptions()" texteVide="Choisis une étape" [formField]="fields.stageId" />
    </e-champ>
    <div class="ds-grid ds-cols-2 ds-gap-4">
      <e-champ libelle="Importance">
        <e-selection [options]="importanceOptions" [formField]="fields.importance" />
      </e-champ>
      <e-champ libelle="Urgence">
        <e-selection [options]="urgencyOptions" [formField]="fields.urgency" />
      </e-champ>
    </div>
  </form>
  <div eFeuilleActions>
    <button eBouton="trait" type="submit" form="feuille-ajout-pas">Ajouter</button>
    <button eBouton="nu" type="button" (click)="ref.close()">Annuler</button>
  </div>
</e-feuille>
