<ax-sheet title="Modifier l'étape">
  <form class="ds-stack" id="feuille-etape" [formRoot]="fields">
    <ax-field label="Le nom de l'étape">
      <input axControl autocomplete="off" [formField]="fields.title" />
    </ax-field>
    <ax-field label="En quelques mots" optional>
      <textarea axControl cdkTextareaAutosize [cdkAutosizeMinRows]="2" [cdkAutosizeMaxRows]="6" [formField]="fields.description"></textarea>
    </ax-field>
    <ax-field label="Pour quand" [optional]="dueDateOptional" hint="L'échéance de cette étape, même approximative.">
      <input axControl type="date" [formField]="fields.dueDate" />
    </ax-field>
  </form>
  <div axSheetActions>
    <button class="btn btn--ghost" type="button" (click)="ref.close()">Annuler</button>
    <button class="btn btn--accent" type="submit" form="feuille-etape">Enregistrer</button>
  </div>
</ax-sheet>
