<ax-sheet title="Modifier l'objectif">
  <form class="ds-stack" id="feuille-objectif" [formRoot]="fields">
    <ax-field label="Ce que tu veux construire">
      <input axControl autocomplete="off" [formField]="fields.title" />
    </ax-field>
    <ax-field label="En quelques mots" optional>
      <textarea axControl cdkTextareaAutosize [cdkAutosizeMinRows]="2" [cdkAutosizeMaxRows]="6" [formField]="fields.description"></textarea>
    </ax-field>
    <ax-field label="Pourquoi ça compte pour toi" optional>
      <textarea axControl cdkTextareaAutosize [cdkAutosizeMinRows]="2" [cdkAutosizeMaxRows]="6" [formField]="fields.why"></textarea>
    </ax-field>
    <ax-field label="Pour quand" [optional]="dueDateOptional" hint="Une date, même approximative. L'horizon se lit au mois.">
      <input axControl type="date" [formField]="fields.dueDate" />
    </ax-field>
  </form>
  <div axSheetActions>
    <button class="btn btn--ghost" type="button" (click)="ref.close()">Annuler</button>
    <button class="btn btn--accent" type="submit" form="feuille-objectif">Enregistrer</button>
  </div>
</ax-sheet>
