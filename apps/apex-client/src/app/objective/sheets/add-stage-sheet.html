<e-feuille titre="Ajouter une étape">
  <form class="ds-stack" id="feuille-ajout-etape" [formRoot]="fields">
    <e-champ libelle="Le nom de l'étape" aide="Une étape rassemble quelques pas. Par exemple : Endurance.">
      <input eSaisie autocomplete="off" [formField]="fields.title" />
    </e-champ>
  </form>
  <div eFeuilleActions>
    <button eBouton="trait" type="submit" form="feuille-ajout-etape">Ajouter</button>
    <button eBouton="nu" type="button" (click)="ref.close()">Annuler</button>
  </div>
</e-feuille>
