<ax-sheet title="Ajouter une étape">
  <form class="ds-stack" id="feuille-ajout-etape" [formRoot]="fields">
    <ax-field label="Le nom de l'étape" hint="Une étape rassemble quelques pas. Par exemple : Endurance.">
      <input axControl autocomplete="off" [formField]="fields.title" />
    </ax-field>
  </form>
  <div axSheetActions>
    <button class="btn btn--ghost" type="button" (click)="ref.close()">Annuler</button>
    <button class="btn btn--accent" type="submit" form="feuille-ajout-etape">Ajouter</button>
  </div>
</ax-sheet>
