<ax-sheet title="Modifier le pas">
  <form class="ds-stack" id="feuille-pas" [formRoot]="fields">
    <ax-field label="Le pas">
      <input axControl autocomplete="off" [formField]="fields.title" />
    </ax-field>
    @if (stageOptions().length > 0) {
      <ax-field label="Étape" [hint]="withoutStage ? 'Range ce pas dans une étape de ton chemin.' : undefined">
        <ax-select [options]="stageOptions()" placeholder="Choisis une étape" [formField]="fields.stageId" />
      </ax-field>
    } @else {
      <p class="small soft">Ajoute une étape à ton objectif pour y ranger ce pas.</p>
    }
    <div class="ds-grid ds-cols-2 ds-gap-4">
      <ax-field label="Importance">
        <ax-select [options]="importanceOptions" [formField]="fields.importance" />
      </ax-field>
      <ax-field label="Urgence">
        <ax-select [options]="urgencyOptions" [formField]="fields.urgency" />
      </ax-field>
    </div>
  </form>
  <div axSheetActions>
    <button class="btn btn--ghost" type="button" (click)="ref.close()">Annuler</button>
    <button class="btn btn--accent" type="submit" form="feuille-pas">Enregistrer</button>
  </div>
</ax-sheet>
