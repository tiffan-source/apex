<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Apex</title>
  <!-- Le petit sceau d'Empreinte : un carré à corne coupée (haut-droit, 45°), tourné de −2°, couleur « sceau ». -->
  <style>
    .sceau { fill: #cc3a1d; }
    @media (prefers-color-scheme: dark) { .sceau { fill: #ff6a4a; } }
  </style>
  <polygon class="sceau" points="4,4 22,4 28,10 28,28 4,28" transform="rotate(-2 16 16)"/>
</svg>
